# Owner request 20 Nov 2026: fill missing company descriptions and sectors for the companies globe with Claude Haiku.
# Manual only. Produces a review artifact (descriptions.json); nothing is published from here.
name: Company descriptions (manual)
on:
  workflow_dispatch:
    inputs:
      max_usd:
        description: 'Hard spend limit in USD (0.1-5)'
        default: '1.0'
permissions:
  contents: read
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q 'anthropic==2.8.0'
      - name: Fill descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_USD: ${{ inputs.max_usd }}
        run: python tools/companies/fill_descriptions.py --max-usd "$MAX_USD" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: company-descriptions
          path: descriptions.json
