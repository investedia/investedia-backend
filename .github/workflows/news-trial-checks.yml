name: Isolated news trial checks
on:
  pull_request:
    paths:
      - 'workers/news-trial/**'
      - 'tests/test_news_trial.py'
      - 'tests/test_data_trials.py'
      - 'tools/cloudflare/stage_frontend.py'
      - 'tools/cloudflare/stage_library_index.py'
      - 'tests/test_cloudflare_library_index.py'
      - 'tools/coverage/country_basics.py'
      - '.github/workflows/news-trial-checks.yml'
      - 'update_globe_news.py'
      - 'news_core.py'
      - 'registry.py'
      - 'events.py'
      - 'tools/news_library.py'
      - 'tools/publish_library.py'
      - 'tools/globe-news/connections.py'
permissions:
  contents: read
jobs:
  offline-trial:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: investedia/investedia-frontend
          ref: 2402119767e01574d478e3df72398bba21ffc132
          token: ${{ secrets.FRONTEND_PUSH_TOKEN }}
          persist-credentials: false
          path: .local/frontend-source
      - uses: actions/checkout@v4
        with:
          repository: investedia/investedia-frontend
          ref: 53b8e93830deab9f574a11745a05e40155fdad2c
          token: ${{ secrets.FRONTEND_PUSH_TOKEN }}
          persist-credentials: false
          path: .local/library-index-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/news_library_index.py
            assets/globe/library-index/all.json
            assets/globe/library-index/meta.json
            assets/globe/library-index/tick-*.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/cloudflare/stage_frontend.py .local/frontend-source
      - run: python tools/cloudflare/stage_library_index.py .local/library-index-source --commit 53b8e93830deab9f574a11745a05e40155fdad2c
      - run: node --test workers/news-trial/*.test.mjs
      - run: python -m unittest discover -s tests -p test_news_trial.py
      - run: python -m unittest discover -s tests -p test_data_trials.py
      - name: Build image locally (no registry push or deployment)
        run: docker build -f workers/news-trial/Dockerfile -t investedia-news-trial-check .
      - name: Check image without network or credentials
        run: docker run --rm --network none --read-only investedia-news-trial-check python workers/news-trial/runner.py --preflight
      - name: Bundle Worker and validate container configuration without deployment
        run: npx --yes wrangler@4.136.0 deploy --dry-run --config workers/news-trial/wrangler.toml --outdir /tmp/news-trial-bundle
