# INERT TEMPLATE: owner must approve and move this file into .github/workflows/.
name: Priority news proposal
on:
  schedule:
    - cron: '17,47 * * * *' # Proposed cadence only; owner must approve.
permissions:
  contents: read
concurrency:
  group: priority-news-production
  cancel-in-progress: false
jobs:
  priority-news:
    if: vars.PRIORITY_NEWS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Restore producer state
        uses: actions/cache@v4
        with:
          path: |
            backend/assets/globe/news-seen.json
            backend/assets/globe/news-live.json
            backend/assets/globe/news-48h.json
            backend/assets/globe/news-archive.json
            backend/assets/globe/news-status.json
            backend/assets/globe/photos
          key: priority-news-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: priority-news-state-
      - name: Generate and ingest priority news
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python tools/news-pipeline.py --run
      - name: Mint frontend-only delivery token
        id: delivery
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NEWS_DELIVERY_APP_ID }}
          private-key: ${{ secrets.NEWS_DELIVERY_APP_PRIVATE_KEY }}
          owner: investedia
          repositories: investedia-frontend
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          repository: investedia/investedia-frontend
          ref: main
          path: frontend
          token: ${{ steps.delivery.outputs.token }}
          persist-credentials: false
      - name: Export saved news and photos and validate build
        run: |
          python backend/tools/export-priority-news.py --frontend frontend
          cd frontend
          python build.py
      - name: Propose frontend delivery as a draft PR
        working-directory: frontend
        env:
          GH_TOKEN: ${{ steps.delivery.outputs.token }}
        run: |
          set -euo pipefail
          branch="codex/priority-news-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add assets/globe/news-live.json assets/globe/news-48h.json assets/globe/news-archive.json assets/globe/news-status.json assets/globe/connections.json assets/globe/photos docs/assets/globe/news-live.json docs/assets/globe/news-48h.json docs/assets/globe/news-archive.json docs/assets/globe/news-status.json docs/assets/globe/connections.json docs/assets/globe/photos
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='Investedia news delivery' -c user.email='news-delivery@users.noreply.github.com' commit -m 'Deliver priority news snapshots and photo assets'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/news-files.txt
          { printf 'Deliver source-timestamped priority news and local photos.\n\nValidation: frontend static build passed. No financial ledgers changed.\n\nFiles changed:\n'; cat /tmp/news-files.txt; } > /tmp/news-pr.md
          gh pr create --draft --repo investedia/investedia-frontend --base main --head "$branch" --title 'Deliver priority news and photo assets' --body-file /tmp/news-pr.md
      - name: Report visible failure
        if: failure()
        run: |
          echo '::error::Priority news generation, ingestion, build or delivery failed. Inspect the failed step; do not report delivery as successful.'
          echo 'Priority-news failed. Worker ingestion can succeed before frontend delivery; inspect both independently.' >> "$GITHUB_STEP_SUMMARY"
