name = "investedia-news-trial"
main = "index.js"
compatibility_date = "2026-11-21"
workers_dev = true
preview_urls = false

[vars]
TRIAL_ENABLED = "false"
PUBLISH_LIBRARY_ENABLED = "false"
LIVE_INGEST_ENABLED = "false"
DATA_PUBLICATION_ENABLED = "false"
SCHEDULED_JOBS = "off"

[triggers]
crons = ["23 */6 * * *", "43 21 * * 1-5", "37 15 * * 1-5", "12 6 * * 0"]

[[containers]]
class_name = "NewsTrial"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./Dockerfile"
# Build from repository root; the Dockerfile-specific allowlist excludes everything else.
build_context = "../.."

[[durable_objects.bindings]]
name = "TRIAL_CONTAINER"
class_name = "NewsTrial"

[exports.NewsTrial]
type = "durable-object"
storage = "sqlite"

[[r2_buckets]]
binding = "TRIAL_STORE"
bucket_name = "investedia-news-trial"

# Private HTTP binding preserves the existing live API authentication and validation.
[[services]]
binding = "LIVE_API"
service = "investedia-live"
