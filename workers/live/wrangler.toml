name = "investedia-live"
main = "index.js"
compatibility_date = "2026-10-01"

# Prices for stocks, indices, commodities and currencies: a cron job saves ONE combined snapshot in KV (unchanged snapshots are skipped), /v1/prices serves it.
# Production must bind the existing KV ID; see docs/DEPLOYMENT-PREPARATION.md. Do not auto-create a replacement namespace.
[[kv_namespaces]]
binding = "PRICES"
# Existing PRICES namespace ID supplied by the owner; deployment remains unapproved.
id = "cb4cba0dba5d4d3489e131ad4b8df847"

[triggers]
# Draft proposal approved for price cadence only; no deployment has occurred.
# Every two minutes: the leading '*' is required cron syntax.
# Keep the legacy GitHub-dispatch alarm and Worker news cron OFF.
crons = ["*/2 * * * *"]

# Free plan limits: 10 ms CPU and 50 subrequests per invocation, 1000 KV writes a day. v1/prices.js stays inside them (about 15 calls per run).
[observability]
enabled = true

# After deploying, add a custom domain in the Cloudflare dashboard: Workers & Pages > investedia-live > Settings > Domains & Routes > Add > Custom domain: live.investedia.com

[vars]
# Pilot API code only; no R2 binding or publication is activated here.
MARKETS_API_ENABLED = "false"
NEWS_CRON = "off"
DISPATCH_ENABLED = "false"
